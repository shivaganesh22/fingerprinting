<!DOCTYPE html>
<html>
<head><title>Benign WebGL Animation</title></head>
<body>
  <h1>Simple 3D Canvas</h1>
  <canvas id="gl" width="100" height="100"></canvas>
  <script>
    const canvas = document.getElementById('gl');
    const gl = canvas.getContext('webgl');
    if (gl) {
      // Normal rendering: set clear color and clear viewport, no parameter enumeration or debug renderer info
      gl.clearColor(0.2, 0.4, 0.8, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
  </script>
</body>
</html>
