<!DOCTYPE html>
<html>
<head><title>Benign Text Rendering</title></head>
<body>
  <h1>Standard Page Rendering</h1>
  <canvas id="c" width="100" height="30"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    // Benign usage measures only 1 or 2 normal fonts for layout fitting
    ctx.font = "16px sans-serif";
    const width = ctx.measureText("Welcome to our website").width;
    console.log("Header text width:", width);
  </script>
</body>
</html>
